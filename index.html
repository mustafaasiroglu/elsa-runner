<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8ed6f8">
  <meta name="description" content="Snowy Skies is a friendly, magical endless runner game.">
  <title>Snowy Skies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell" aria-label="Snowy Skies game">
    <canvas id="game" aria-label="A magical snow runner game" role="img"></canvas>
    <section class="hud" aria-label="Game score">
      <div class="score-card"><span aria-hidden="true">⭐</span><strong id="score">0</strong></div>
      <div class="score-card"><span aria-hidden="true">❄</span><strong id="flakes">0</strong></div>
      <button id="pause-button" class="icon-button" aria-label="Pause game">Ⅱ</button>
    </section>
    <section id="start-screen" class="overlay" aria-labelledby="game-title">
      <div class="panel">
        <div class="title-sparkles" aria-hidden="true">✦ ❄ ✦</div>
        <h1 id="game-title">Snowy Skies</h1>
        <p class="subtitle">A magical little run</p>
        <button id="play-button" class="primary-button">▶ Play</button>
        <div class="menu-actions">
          <button id="camera-button" class="secondary-button">📷 Add your face</button>
          <button id="sound-button" class="secondary-button" aria-pressed="true">🔊 Sound</button>
          <button id="fullscreen-button" class="secondary-button">⛶ Big screen</button>
        </div>
        <p class="best-score">🏆 Best <strong id="best-score">0</strong></p>
        <p class="tap-hint">Hold to jump higher · Tap, click, or press space to jump</p>
      </div>
    </section>
    <section id="camera-screen" class="overlay hidden" aria-labelledby="camera-title">
      <div class="panel camera-panel">
        <h2 id="camera-title">Add your face</h2>
        <p class="subtitle">Take a photo to put your face on the runner.</p>
        <video id="camera-preview" class="camera-preview" autoplay muted playsinline aria-label="Camera preview"></video>
        <p id="camera-message" class="camera-message" role="status">Allow camera access to take a photo.</p>
        <div class="menu-actions">
          <button id="capture-button" class="primary-button" disabled>📸 Take photo</button>
          <button id="close-camera-button" class="secondary-button">Cancel</button>
        </div>
      </div>
    </section>
    <section id="pause-screen" class="overlay hidden" aria-labelledby="pause-title">
      <div class="panel small-panel">
        <h2 id="pause-title">Little break</h2>
        <button id="resume-button" class="primary-button">▶ Keep going</button>
      </div>
    </section>
    <section id="game-over-screen" class="overlay hidden" aria-labelledby="game-over-title">
      <div class="panel small-panel pop">
        <div class="sad-face" aria-hidden="true">❄</div>
        <h2 id="game-over-title">Oopsie!</h2>
        <p>You found an icy bump.</p>
        <p class="final-score">⭐ <strong id="final-score">0</strong> &nbsp; ❄ <strong id="final-flakes">0</strong></p>
        <button id="again-button" class="primary-button">↻ Play again</button>
      </div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
